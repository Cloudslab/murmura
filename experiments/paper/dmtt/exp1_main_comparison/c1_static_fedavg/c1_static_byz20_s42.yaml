# C1 — Static FedAvg baseline (simulation)
# Byzantine fraction: 20 %  |  seed: 42
experiment:
  name: "C1-StaticFedAvg-byz20-s42"
  seed: 42
  rounds: 50
  verbose: true
topology:
  type: "fully"
  num_nodes: 10
  seed: 12345
aggregation:
  algorithm: "fedavg"
  params: {}
attack:
  enabled: true
  type: "topology_liar"
  percentage: 0.2
  params:
    model_attack_type: "gaussian"
    noise_std: 10.0
training:
  local_epochs: 2
  batch_size: 32
  lr: 0.01
  max_samples: null
data:
  adapter: "wearables.uci_har"
  params:
    data_path: "wearables_datasets/UCI HAR Dataset"
    split: "train"
    partition_method: "dirichlet"
    alpha: 0.5
model:
  factory: "examples.wearables.uci_har"
  params:
    input_dim: 561
    hidden_dims: [256, 128]
    num_classes: 6
    dropout: 0.3
backend: simulation
