# Exp 2 — C3 Full DMTT (distributed)
# Dataset: PAMAP2  |  Byzantine: 30 %  |  seed: 777
experiment:
  name: "Exp2-C3-DMTT-byz30-s777"
  seed: 777
  rounds: 50
  verbose: true
topology:
  type: "fully"
  num_nodes: 9
  seed: 12345
aggregation:
  algorithm: "fedavg"
  params: {}
attack:
  enabled: true
  type: "topology_liar"
  percentage: 0.3
  params:
    model_attack_type: "gaussian"
    noise_std: 10.0
training:
  local_epochs: 2
  batch_size: 64
  lr: 0.001
  max_samples: null
data:
  adapter: "wearables.pamap2"
  params:
    data_path: "wearables_datasets/PAMAP2_Dataset"
    partition_method: "dirichlet"
    alpha: 0.5
    window_size: 100
    window_stride: 50
    include_heart_rate: true
    normalize: true
model:
  factory: "examples.wearables.pamap2"
  params:
    input_dim: 4000
    hidden_dims: [512, 256, 128]
    num_classes: 12
    dropout: 0.3
backend: distributed

distributed:
  transport: ipc
  ipc_dir: "/tmp/murmura_exp2_c3_dmtt_byz30_s777"
  round_duration_s: 30.0
  startup_grace_s: 5.0
trace_mobility:
  trace_path: "data/sociopatterns/primary_school_N9_R30s.csv"
  num_nodes: 9
  ensure_connected: true
dmtt:
  budget_B: 4
  rho: 0.1
  lambda_forget: 0.98
  w_d: 2.0
  w_c: 0.5
  w_x: 1.0
  tau_U: 0.3
  eta: 5.0
  w_a: 0.7
  tau_u: 0.5
  lambda1: 0.1
  lambda2: 0.6
  lambda3: 0.2
  lambda4: 0.1
